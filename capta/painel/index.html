<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Captapp</title>
<link rel="stylesheet" href="/painel.css">
</head>
<body>
  <div id="entrada" hidden>
    <form id="form-entrada">
      <div class="marca-grande">captapp</div>
      <p class="sub">Painel do lojista</p>
      <label>E-mail<input type="email" name="email" required autocomplete="email"></label>
      <label>Senha<input type="password" name="senha" required autocomplete="current-password"></label>
      <label id="campo-nome" hidden>Nome da loja<input type="text" name="nome" autocomplete="organization"></label>
      <p class="erro" id="erro-entrada" hidden></p>
      <button type="submit" id="botao-entrada">Entrar</button>
      <p class="troca"><a href="#" id="alternar">Nao tenho conta ainda</a> <span class="sep">|</span> <a href="#" id="esqueci">Esqueci minha senha</a></p>
    </form>
    <form id="form-esqueci" hidden>
      <div class="marca-grande">captapp</div>
      <p class="sub">Recuperar a senha</p>
      <label>E-mail da conta<input type="email" name="email" required autocomplete="email"></label>
      <p class="erro" id="erro-esqueci" hidden></p>
      <p class="ok" id="ok-esqueci" hidden></p>
      <button type="submit">Mandar o link</button>
      <p class="troca"><a href="#" id="voltar-entrada">Voltar para o login</a></p>
    </form>
    <form id="form-nova-senha" hidden>
      <div class="marca-grande">captapp</div>
      <p class="sub">Escolha a senha nova</p>
      <label>Senha nova, no minimo 8 caracteres<input type="password" name="senha" required minlength="8" autocomplete="new-password"></label>
      <label>Repita a senha<input type="password" name="confirma" required minlength="8" autocomplete="new-password"></label>
      <p class="erro" id="erro-nova-senha" hidden></p>
      <button type="submit">Salvar e entrar</button>
    </form>
  </div>

  <div id="app" hidden>
    <header class="barra">
      <div class="marca">captapp</div>
      <div class="busca">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" id="busca" placeholder="Busque um lead por nome, e-mail ou cupom" autocomplete="off">
      </div>
      <div class="acoes-barra">
        <button type="button" class="icone" id="sino" aria-label="Alertas">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 1 0-12 0c0 7-2 8-2 8h16s-2-1-2-8"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
          <span class="conta-badge" id="badge-alertas" hidden>0</span>
        </button>
        <div class="chip-conta">
          <span class="avatar" id="avatar">LD</span>
          <span class="nome-conta" id="nome-conta"></span>
          <button type="button" id="sair">Sair</button>
        </div>
      </div>
    </header>

    <div class="corpo">
      <aside>
        <nav>
          <a href="#/hoje">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
            <span>Hoje</span>
          </a>
          <a href="#/leads">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 20v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 20v-2a4 4 0 0 0-3-3.9"/></svg>
            <span>Leads</span>
          </a>
          <a href="#/chat">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8"/><path d="M8 12h5"/></svg>
            <span>Chat</span>
          </a>
          <a href="#/integracoes">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 2v6"/><path d="M15 2v6"/><path d="M6 8h12v4a6 6 0 0 1-12 0z"/><path d="M12 18v4"/></svg>
            <span>Integracoes</span>
          </a>
          <a href="#/admin" id="menu-admin" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20h18"/><path d="M5 20V9l7-5 7 5v11"/><path d="M10 20v-6h4v6"/></svg>
            <span>Admin</span>
          </a>
          <a href="#/financeiro">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v10"/><path d="M14.5 9.5h-4a1.5 1.5 0 0 0 0 3h3a1.5 1.5 0 0 1 0 3h-4"/></svg>
            <span>Financeiro</span>
          </a>
          <a href="#/configuracoes">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
            <span>Configuracoes</span>
          </a>
        </nav>
        <div class="rodape-lateral">
          <div class="cartao-plano" id="cartao-plano" hidden>
            <span class="rotulo-plano" id="rotulo-plano"></span>
            <p id="texto-plano"></p>
          </div>
        </div>
      </aside>

      <main>
        <div id="faixa" hidden></div>
        <div id="tela"></div>
      </main>
    </div>
  </div>

  <script src="/painel.js"></script>
</body>
</html>
